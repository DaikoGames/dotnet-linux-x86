name: Experimental .NET Linux-x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  CONFIGURATION: Release
  TARGET_ARCH: x86
  TARGET_OS: linux
  HOST_ARCH: x64
  ROOTFS_DIR: ${{ github.workspace }}/.tools/rootfs/x86

jobs:
  build-coreclr-x86:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout .NET Runtime
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: release/10.0
          fetch-depth: 1

      - name: Enable 32-bit packages
        run: |
          set -eux

          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            binutils \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            git \
            curl \
            pkg-config \
            zlib1g-dev:i386 \
            libssl-dev:i386 \
            libicu-dev:i386

      - name: Verify 32-bit compiler
        run: |
          set -eux

          cat > /tmp/test32.c <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              printf("32-bit compiler works\n");
              return 0;
          }
          EOF

          gcc -m32 /tmp/test32.c -o /tmp/test32

          file /tmp/test32

          /tmp/test32

          file /tmp/test32 | grep -q 'ELF 32-bit.*Intel 80386'

      - name: Create Linux x86 rootfs
        run: |
          set -eux

          mkdir -p "$ROOTFS_DIR"

          sudo ./eng/common/cross/build-rootfs.sh \
            x86 \
            noble \
            --skipemulation \
            --rootfsdir "$ROOTFS_DIR"

          sudo chown -R "$(id -u):$(id -g)" "$ROOTFS_DIR"

      - name: Verify rootfs
        run: |
          set -eux

          test -d "$ROOTFS_DIR/usr"
          test -d "$ROOTFS_DIR/usr/include"
          test -d "$ROOTFS_DIR/usr/lib"

          echo "ROOTFS_DIR=$ROOTFS_DIR"

          find "$ROOTFS_DIR/usr/lib" \
            -maxdepth 2 \
            -type f \
            \( -name 'libc.so*' -o -name 'libgcc_s.so*' \) \
            | head -50

      - name: Restore runtime tools
        run: |
          set -eux

          ./restore.sh

      - name: Build CoreCLR Linux x86
        run: |
          set -eux
          set -o pipefail

          mkdir -p build-log

          export ROOTFS_DIR="$ROOTFS_DIR"

          ./src/coreclr/build-runtime.sh \
            -arch x86 \
            -hostarch x64 \
            -os linux \
            -release \
            -cross \
            -component clr.runtime \
            -component clr.corelib \
            -component clr.jit \
            2>&1 | tee build-log/coreclr-x86.log

      - name: Locate CoreCLR artifacts
        run: |
          set -eux

          find artifacts/bin/coreclr \
            -maxdepth 3 \
            -type f \
            \( \
              -name 'libcoreclr.so' \
              -o -name 'clrjit.so' \
              -o -name 'corerun' \
              -o -name 'System.Private.CoreLib.dll' \
            \) \
            -print

      - name: Verify CoreCLR architecture
        run: |
          set -eux

          CORECLR_DIR="artifacts/bin/coreclr/linux.x86.Release"

          test -d "$CORECLR_DIR"

          echo "=== CoreCLR directory ==="
          ls -lah "$CORECLR_DIR"

          echo
          echo "=== ELF files ==="

          find "$CORECLR_DIR" \
            -type f \
            -exec file {} \; \
            | grep -E 'ELF|80386' \
            || true

      - name: Verify libcoreclr.so
        run: |
          set -eux

          CORECLR="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'libcoreclr.so' \
              | head -1
          )"

          test -n "$CORECLR"

          echo "CoreCLR: $CORECLR"

          file "$CORECLR"

          file "$CORECLR" | grep -q 'ELF 32-bit.*Intel 80386'

      - name: Verify JIT
        run: |
          set -eux

          JIT="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'clrjit.so' \
              | head -1
          )"

          test -n "$JIT"

          echo "JIT: $JIT"

          file "$JIT"

          file "$JIT" | grep -q 'ELF 32-bit.*Intel 80386'

      - name: Verify corerun
        run: |
          set -eux

          CORERUN="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'corerun' \
              | head -1
          )"

          test -n "$CORERUN"

          echo "corerun: $CORERUN"

          file "$CORERUN"

          file "$CORERUN" | grep -q 'ELF 32-bit.*Intel 80386'

          chmod +x "$CORERUN"

          "$CORERUN" --help || true

      - name: Upload CoreCLR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coreclr-linux-x86-${{ github.sha }}
          path: |
            artifacts/bin/coreclr/linux.x86.Release
            build-log/coreclr-x86.log
          if-no-files-found: warn
