name: Experimental .NET Linux-x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  CONFIGURATION: Release
  TARGET_ARCH: x86
  TARGET_OS: linux
  HOST_ARCH: x64
  ROOTFS_DIR: ${{ github.workspace }}/.tools/rootfs/x86

jobs:
  build-coreclr-x86:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Source
      # ============================================================

      - name: Checkout .NET Runtime
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: release/10.0
          fetch-depth: 1


      # ============================================================
      # Enable 32-bit architecture
      # ============================================================

      - name: Enable 32-bit architecture
        run: |
          set -eux

          sudo dpkg --add-architecture i386
          sudo apt-get update


      # ============================================================
      # Host build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            binutils \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            pkg-config \
            zlib1g-dev:i386 \
            libssl-dev:i386 \
            libicu-dev:i386


      # ============================================================
      # Python dependencies required by install-debs.py
      # ============================================================

      - name: Install rootfs Python dependencies
        run: |
          set -eux

          python3 -m pip install \
            --user \
            --break-system-packages \
            aiohttp

          python3 -c \
            "import aiohttp; print('aiohttp:', aiohttp.__version__)"


      # ============================================================
      # Verify 32-bit compiler
      # ============================================================

      - name: Verify 32-bit compiler
        run: |
          set -eux

          cat > /tmp/test32.c <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              printf("32-bit compiler works\n");
              return 0;
          }
          EOF

          gcc -m32 /tmp/test32.c -o /tmp/test32

          file /tmp/test32

          /tmp/test32

          file /tmp/test32 | grep -q \
            'ELF 32-bit.*Intel 80386'


      # ============================================================
      # Build Linux x86 rootfs
      # ============================================================

      - name: Create Linux x86 rootfs
        run: |
          set -eux

          rm -rf "$ROOTFS_DIR"
          mkdir -p "$ROOTFS_DIR"

          python3 ./eng/common/cross/install-debs.py \
            --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg \
            --force-check-gpg \
            --arch i386 \
            --mirror https://archive.ubuntu.com/ubuntu/ \
            --rootfsdir "$ROOTFS_DIR" \
            --artool /usr/bin/ar \
            --suite noble \
            --suite noble-updates \
            --suite noble-security \
            --suite noble-backports \
            build-essential \
            symlinks \
            libicu-dev \
            libunwind8-dev \
            libcurl4-openssl-dev \
            libkrb5-dev \
            libssl-dev \
            zlib1g-dev \
            libbrotli-dev \
            libomp5 \
            libomp-dev

          sudo chown -R "$(id -u):$(id -g)" "$ROOTFS_DIR"


      # ============================================================
      # Verify rootfs
      # ============================================================

      - name: Verify Linux x86 rootfs
        run: |
          set -eux

          test -d "$ROOTFS_DIR"
          test -d "$ROOTFS_DIR/usr"
          test -d "$ROOTFS_DIR/usr/include"

          echo "========================================"
          echo "Linux x86 rootfs"
          echo "========================================"

          du -sh "$ROOTFS_DIR"

          echo
          echo "========================================"
          echo "32-bit libraries"
          echo "========================================"

          find "$ROOTFS_DIR" \
            -type f \
            \( \
              -name 'libc.so*' \
              -o -name 'libgcc_s.so*' \
              -o -name 'libstdc++.so*' \
            \) \
            -print \
            | head -50

          echo
          echo "========================================"
          echo "libc architecture"
          echo "========================================"

          LIBC="$(
            find "$ROOTFS_DIR" \
              -type f \
              -path '*i386-linux-gnu*' \
              -name 'libc.so.6' \
              | head -1
          )"

          if [ -z "$LIBC" ]; then
            echo "ERROR: 32-bit libc was not found."
            exit 1
          fi

          echo "libc: $LIBC"

          file "$LIBC"

          file "$LIBC" | grep -q \
            'ELF 32-bit.*Intel 80386'


      # ============================================================
      # Build CoreCLR
      # ============================================================

      - name: Build CoreCLR Linux x86
        run: |
          set -eux
          set -o pipefail

          mkdir -p build-log

          export ROOTFS_DIR="$ROOTFS_DIR"

          ./src/coreclr/build-runtime.sh \
            -arch x86 \
            -hostarch x64 \
            -os linux \
            -release \
            -cross \
            -component clr.runtime \
            -component clr.corelib \
            -component clr.jit \
            2>&1 \
            | tee build-log/coreclr-x86.log


      # ============================================================
      # Locate artifacts
      # ============================================================

      - name: Locate CoreCLR artifacts
        run: |
          set -eux

          echo
          echo "========================================"
          echo "CoreCLR artifacts"
          echo "========================================"

          find artifacts/bin/coreclr \
            -type f \
            \( \
              -name 'libcoreclr.so' \
              -o -name 'clrjit.so' \
              -o -name 'corerun' \
              -o -name 'System.Private.CoreLib.dll' \
            \) \
            -print


      # ============================================================
      # Verify libcoreclr.so
      # ============================================================

      - name: Verify libcoreclr.so
        run: |
          set -eux

          CORECLR="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'libcoreclr.so' \
              | head -1
          )"

          if [ -z "$CORECLR" ]; then
            echo "ERROR: libcoreclr.so was not produced."
            exit 1
          fi

          echo "CoreCLR:"
          echo "$CORECLR"

          file "$CORECLR"

          file "$CORECLR" | grep -q \
            'ELF 32-bit.*Intel 80386'


      # ============================================================
      # Verify JIT
      # ============================================================

      - name: Verify CoreCLR JIT
        run: |
          set -eux

          JIT="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'clrjit.so' \
              | head -1
          )"

          if [ -z "$JIT" ]; then
            echo "ERROR: clrjit.so was not produced."
            exit 1
          fi

          echo "JIT:"
          echo "$JIT"

          file "$JIT"

          file "$JIT" | grep -q \
            'ELF 32-bit.*Intel 80386'


      # ============================================================
      # Verify corerun
      # ============================================================

      - name: Verify corerun
        run: |
          set -eux

          CORERUN="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'corerun' \
              | head -1
          )"

          if [ -z "$CORERUN" ]; then
            echo "ERROR: corerun was not produced."
            exit 1
          fi

          echo "corerun:"
          echo "$CORERUN"

          file "$CORERUN"

          file "$CORERUN" | grep -q \
            'ELF 32-bit.*Intel 80386'

          chmod +x "$CORERUN"

          echo
          echo "========================================"
          echo "corerun --help"
          echo "========================================"

          "$CORERUN" --help || true


      # ============================================================
      # Verify generated native binaries
      # ============================================================

      - name: Verify native CoreCLR binaries
        run: |
          set -eux

          echo
          echo "========================================"
          echo "32-bit ELF binaries"
          echo "========================================"

          find artifacts/bin/coreclr \
            -type f \
            -exec file {} \; \
            | grep 'ELF 32-bit'


      # ============================================================
      # Diagnostics
      # ============================================================

      - name: Show CoreCLR output
        if: always()
        run: |
          set +e

          echo
          echo "========================================"
          echo "CoreCLR output tree"
          echo "========================================"

          find artifacts/bin/coreclr \
            -maxdepth 5 \
            -type f \
            -print \
            | sort


      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload CoreCLR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coreclr-linux-x86-${{ github.sha }}
          path: |
            artifacts/bin/coreclr/
            build-log/coreclr-x86.log
          if-no-files-found: warn
