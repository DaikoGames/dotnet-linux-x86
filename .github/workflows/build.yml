name: Experimental .NET 10 Linux-x86

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86:
    runs-on: ubuntu-24.04

    env:
      CONFIGURATION: Release
      TARGET_ARCH: x86
      TARGET_OS: linux
      ROOTFS_DIR: ${{ github.workspace }}/.tools/rootfs/x86

      # Linux-x86 is intentionally being revived locally.
      # Microsoft does not provide a linux-x86 AppHost NuGet package.
      UseLocalAppHostPack: true

    steps:
      - name: Checkout .NET 10 runtime
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: release/10.0
          fetch-depth: 1

      - name: Enable i386 architecture
        run: |
          set -eux

          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install host and x86 build dependencies
        run: |
          set -eux

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev \
            libc6-dev-i386 \
            binutils \
            binutils-multiarch \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            git \
            curl \
            wget \
            file \
            patchelf \
            pkg-config \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Verify x86 compiler
        run: |
          set -eux

          cat > /tmp/linux-x86-test.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>

          int main(void)
          {
              printf("Linux x86 compiler test\n");
              printf("pointer size: %zu bytes\n", sizeof(void*));
              printf("uintptr_t size: %zu bytes\n", sizeof(uintptr_t));
              return 0;
          }
          EOF

          gcc \
            -m32 \
            -fPIC \
            /tmp/linux-x86-test.c \
            -o /tmp/linux-x86-test

          file /tmp/linux-x86-test

          readelf -h /tmp/linux-x86-test

          /tmp/linux-x86-test

          file /tmp/linux-x86-test | grep -q 'ELF 32-bit'

      - name: Inspect AppHost configuration
        run: |
          set -eux

          echo "Searching for AppHost handling..."

          grep -R \
            -n \
            -E \
            'UseLocalAppHostPack|KnownAppHostPack|AppHostSourcePath|NETSDK1084' \
            eng \
            src \
            Build.proj \
            Directory.Build.* \
            2>/dev/null \
            | head -n 500 \
            || true

      - name: Attempt CoreCLR build
        run: |
          set -eux
          set -o pipefail

          mkdir -p build-log

          ./build.sh \
            -subset clr \
            -configuration "$CONFIGURATION" \
            -arch "$TARGET_ARCH" \
            -os "$TARGET_OS" \
            -ninja \
            /p:UseLocalAppHostPack=true \
            2>&1 | tee build-log/coreclr-x86.log

      - name: Locate CoreCLR output
        if: always()
        run: |
          set +e

          mkdir -p output

          echo "===== CoreCLR directories ====="

          find artifacts/bin/coreclr \
            -maxdepth 3 \
            -type d \
            2>/dev/null \
            | sort || true

          echo
          echo "===== CoreCLR binaries ====="

          find artifacts/bin/coreclr \
            -type f \
            \( \
              -name corerun \
              -o -name libcoreclr.so \
              -o -name System.Private.CoreLib.dll \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | tee output/generated-files.txt

      - name: Verify ELF architecture
        if: always()
        run: |
          set +e

          : > output/architecture.txt

          while IFS= read -r binary; do
            [ -f "$binary" ] || continue

            echo "========================================" \
              | tee -a output/architecture.txt

            echo "FILE: $binary" \
              | tee -a output/architecture.txt

            file "$binary" \
              | tee -a output/architecture.txt

            readelf -h "$binary" \
              | grep -E 'Class:|Machine:|OS/ABI:' \
              | tee -a output/architecture.txt

          done < output/generated-files.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-x86-build
          path: |
            build-log/
            output/
            artifacts/log/
          if-no-files-found: warn
