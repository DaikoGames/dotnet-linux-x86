name: Build & Test .NET 9 Linux x86 (TRUE 32-Bit Docker Fallback)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test-linux-x86:
    # CRITICAL: Force GitHub to run this job inside a 32-bit (i386) Ubuntu 22.04 container.
    # GitHub will automatically use QEMU to emulate the 32-bit environment.
    runs-on: ubuntu-latest
    container:
      image: i386/ubuntu:22.04
      options: --privileged 

    env:
      UseNinja: true
      CMAKE_GENERATOR: Ninja
      # Wir behalten deine entscheidenden IL-Fixes bei!
      CFLAGS: "-mstackrealign -fPIC"
      CXXFLAGS: "-mstackrealign -fPIC -ftls-model=global-dynamic"
      LDFLAGS: "-Wl,-z,noexecstack"
      # Verhindert, dass die GC versucht, zu viel Speicher im emulierten 32-Bit-Raum zu reservieren
      DOTNET_GCHeapHardLimit: "0x40000000" # 1GB
      DEBIAN_FRONTEND: noninteractive

    steps:
    - name: Install System Dependencies (Native 32-bit)
      run: |
        apt-get update
        # Grundlegende Build-Tools
        apt-get install -y wget curl python3 git cmake ninja-build ccache clang file
        
        # Native 32-Bit-Abhängigkeiten (Kein :i386-Suffix nötig, wir SIND bereits i386!)
        # Ubuntu 22.04 wird verwendet, da 24.04 viele 32-Bit-Pakete entfernt hat
        apt-get install -y gcc g++ zlib1g-dev libicu-dev libssl-dev libunwind-dev libc6-dev libstdc++-11-dev

    - name: Setup ccache
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        ccache -M 1.5G
        ccache -z

    - name: Checkout .NET 9 Runtime
      uses: actions/checkout@v4
      with:
        repository: dotnet/runtime
        ref: release/9.0
        path: runtime

    - name: Install and Patch .NET SDK
      working-directory: runtime
      run: |
        SDK_VERSION=$(python3 -c "import json; print(json.load(open('global.json'))['sdk']['version'])")
        echo "Required SDK version: $SDK_VERSION"
        
        mkdir -p .dotnet
        wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --version $SDK_VERSION --install-dir .dotnet
        
        # Patch RID Graph, um linux-x86 zu erlauben
        python3 -c "
        import json
        path = '.dotnet/sdk/$SDK_VERSION/RuntimeIdentifierGraph.json'
        with open(path, 'r') as f:
            data = json.load(f)
        if 'linux-x86' not in data['runtimes']:
            data['runtimes']['linux-x86'] = { '#import': ['linux'] }
        with open(path, 'w') as f:
            json.dump(data, f, indent=2)
        print('Successfully patched RuntimeIdentifierGraph.json')
        "

    - name: Build CoreCLR and Libraries (NATIVE 32-bit build)
      working-directory: runtime
      env:
        DOTNET_INSTALL_DIR: ${{ github.workspace }}/runtime/.dotnet
        DOTNET_MULTILEVEL_LOOKUP: 0
      run: |
        # WICHTIG: KEIN '-cross' Flag! Wir bauen nativ innerhalb des 32-Bit-Containers.
        # Das vermeidet alle Cross-Compiling-Pfad-Probleme.
        ./build.sh -os linux -arch x86 -c Release -subset clr+libs --ninja \
          /p:UseNinja=true \
          /p:InvariantGlobalization=false \
          /p:BuildAppHost=false

    - name: Package Self-Contained Runtime
      run: |
        mkdir -p dotnet-portable-x86
        
        CORECLR_DIR=$(find runtime/artifacts/bin/coreclr -type d \( -name "Linux.x86.Release" -o -name "linux.x86.Release" \) | head -n 1)
        echo "Found CoreCLR dir: $CORECLR_DIR"
        
        if [ -z "$CORECLR_DIR" ]; then
          echo "ERROR: Could not find exact x86 release directory!"
          find runtime/artifacts/bin/coreclr -type d | head -n 10
          exit 1
        fi
        
        cp "$CORECLR_DIR/corerun" dotnet-portable-x86/
        cp "$CORECLR_DIR"/*.so dotnet-portable-x86/
        find "$CORECLR_DIR" -name "System.Private.CoreLib.dll" -exec cp {} dotnet-portable-x86/ \;
        
        RUNTIME_DLL=$(find runtime/artifacts/bin -type f -name "System.Runtime.dll" | head -n 1)
        if [ -n "$RUNTIME_DLL" ]; then
          RUNTIME_DIR=$(dirname "$RUNTIME_DLL")
          echo "Found Runtime dir: $RUNTIME_DIR"
          cp "$RUNTIME_DIR"/*.dll dotnet-portable-x86/
        else
          echo "ERROR: Could not find System.Runtime.dll!"
          exit 1
        fi

    - name: Diagnostic Architecture Check
      run: |
        echo "=== Architecture Check (MUST say 32-bit) ==="
        file dotnet-portable-x86/corerun
        file dotnet-portable-x86/libcoreclr.so

    - name: Create "Run From Anywhere" Launcher
      run: |
        cat << 'EOF' > dotnet-portable-x86/run.sh
        #!/bin/bash
        DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"
        export DOTNET_ROOT="$DIR"
        export DOTNET_TieredCompilation=0
        exec "$DIR/corerun" "$@"
        EOF
        chmod +x dotnet-portable-x86/run.sh

    - name: Install Standard .NET 9 SDK (for testing)
      run: |
        wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        # Wir installieren das x64 SDK nur, um die Test-App zu kompilieren. Die App selbst wird für linux-x86 gebaut.
        ./dotnet-install.sh --channel 9.0 --install-dir ./dotnet-sdk

    - name: Create & Compile IL Stress Test
      run: |
        ./dotnet-sdk/dotnet new console -n IL_Stress_Test -o IL_Stress_Test --framework net9.0
        cat << 'CSHARP' > IL_Stress_Test/Program.cs
        using System;
        using System.Threading;
        using System.Threading.Tasks;
        using System.Runtime.InteropServices;

        class Program {
            static int Main() {
                Console.WriteLine("=== Starting IL Stress Test for Linux x86 ===");
                double result = 0;
                for(int i=0; i<10000; i++) result += Math.Sin(i) * Math.Cos(i);
                Console.WriteLine($"[PASS] Math/SSE Stack Alignment: {result}");
                Parallel.For(0, 100, i => { Thread.Sleep(1); });
                Console.WriteLine("[PASS] Threading & TLS");
                byte[][] arrays = new byte[100][];
                for(int i=0; i<100; i++) arrays[i] = new byte[1024 * 1024]; 
                GC.Collect();
                Console.WriteLine("[PASS] GC & Memory Allocation");
                int pid = getpid();
                Console.WriteLine($"[PASS] P/Invoke (libc getpid): {pid}");
                Console.WriteLine("=== ALL IL TESTS PASSED! RUNTIME IS STABLE ===");
                return 0;
            }
            [DllImport("libc")]
            static extern int getpid();
        }
        CSHARP
        ./dotnet-sdk/dotnet build IL_Stress_Test -c Release

    - name: Execute IL Stress Test
      run: |
        ./dotnet-portable-x86/run.sh ./IL_Stress_Test/bin/Release/net9.0/IL_Stress_Test.dll

    # KORRIGIERT: In zwei separate Steps aufgeteilt
    - name: Zip the Final Abomination
      if: success()
      run: |
        zip -r dotnet9-linux-x86-portable.zip dotnet-portable-x86

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dotnet9-linux-x86-true-32bit
        path: dotnet9-linux-x86-portable.zip
        retention-days: 7
