name: Experimental .NET 10 Linux-x86

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86:
    runs-on: ubuntu-24.04

    env:
      CONFIGURATION: Release
      TARGET_ARCH: x86
      TARGET_OS: linux
      ROOTFS_DIR: ${{ github.workspace }}/.tools/rootfs/x86

    steps:
      - name: Checkout .NET 10 runtime
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: release/10.0
          fetch-depth: 1

      - name: Enable i386 architecture
        run: |
          set -eux

          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install host and x86 build dependencies
        run: |
          set -eux

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev \
            libc6-dev-i386 \
            binutils \
            binutils-multiarch \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            git \
            curl \
            wget \
            file \
            patchelf \
            pkg-config \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Verify host compiler
        run: |
          set -eux

          gcc --version
          g++ --version
          cmake --version
          ninja --version

      - name: Verify Linux x86 compiler
        run: |
          set -eux

          cat > /tmp/linux-x86-test.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>

          int main(void)
          {
              printf("Linux x86 compiler test\n");
              printf("sizeof(void*) = %zu\n", sizeof(void*));
              printf("sizeof(uintptr_t) = %zu\n", sizeof(uintptr_t));
              return 0;
          }
          EOF

          gcc \
            -m32 \
            -fPIC \
            /tmp/linux-x86-test.c \
            -o /tmp/linux-x86-test

          file /tmp/linux-x86-test

          readelf -h /tmp/linux-x86-test

          /tmp/linux-x86-test

          test "$(file /tmp/linux-x86-test | grep -c 'ELF 32-bit')" -eq 1

      - name: Prepare x86 ROOTFS directory
        run: |
          set -eux

          mkdir -p "$ROOTFS_DIR"

          echo "ROOTFS_DIR=$ROOTFS_DIR"

      - name: Inspect existing cross-build infrastructure
        run: |
          set -eux

          echo "Checking runtime cross-build files..."

          test -f eng/common/cross/build-rootfs.sh

          echo
          echo "Available cross infrastructure:"
          find eng/common/cross \
            -maxdepth 2 \
            -type f \
            -print | sort

      - name: Show architecture support in source
        run: |
          set -eux

          echo "Searching for Linux/x86 architecture handling..."

          grep -R \
            -n \
            -E \
            'UNIX_X86_ABI|TARGET_X86|CLR_CMAKE_TARGET_ARCH_X86|x86.*linux|linux.*x86' \
            src/coreclr \
            eng \
            2>/dev/null \
            | head -n 500 \
            || true

      - name: Attempt native x86 CoreCLR configure
        run: |
          set -eux
          set -o pipefail

          mkdir -p build-log

          ./build.sh \
            -subset clr \
            -configuration "$CONFIGURATION" \
            -arch "$TARGET_ARCH" \
            -os "$TARGET_OS" \
            -ninja \
            2>&1 | tee build-log/coreclr-x86.log

      - name: Locate CoreCLR output
        if: always()
        run: |
          set +e

          echo "===== CoreCLR output directories ====="

          find artifacts/bin/coreclr \
            -maxdepth 3 \
            -type d \
            2>/dev/null \
            | sort || true

          echo
          echo "===== CoreCLR binaries ====="

          find artifacts/bin/coreclr \
            -type f \
            \( \
              -name corerun \
              -o -name libcoreclr.so \
              -o -name System.Private.CoreLib.dll \
            \) \
            -print \
            2>/dev/null \
            | sort || true

      - name: Verify produced ELF files
        if: always()
        run: |
          set +e

          mkdir -p output

          find artifacts/bin/coreclr \
            -type f \
            \( \
              -name corerun \
              -o -name libcoreclr.so \
            \) \
            -print \
            > output/native-binaries.txt \
            2>/dev/null || true

          : > output/architecture.txt

          while IFS= read -r binary; do
            [ -f "$binary" ] || continue

            echo "========================================" \
              | tee -a output/architecture.txt

            echo "$binary" \
              | tee -a output/architecture.txt

            file "$binary" \
              | tee -a output/architecture.txt

            readelf -h "$binary" \
              | grep -E 'Class:|Machine:|OS/ABI:' \
              | tee -a output/architecture.txt

          done < output/native-binaries.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-x86-build
          path: |
            build-log/
            output/
            artifacts/log/
          if-no-files-found: warn
