name: Build & Test .NET 9 Linux x86 (Minimal TPA + Ultimate Diagnostics)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  UseNinja: true
  CMAKE_GENERATOR: Ninja
  CFLAGS: "-mstackrealign -fPIC"
  CXXFLAGS: "-mstackrealign -fPIC -ftls-model=global-dynamic"
  LDFLAGS: "-Wl,-z,noexecstack"

jobs:
  build-and-test-linux-x86:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fix Kernel Memory Limits
      run: |
        sudo sysctl -w vm.overcommit_memory=1
        sudo sysctl -w vm.max_map_count=262144
        ulimit -v unlimited
        ulimit -m unlimited

    - name: Checkout .NET 9 Runtime
      uses: actions/checkout@v4
      with:
        repository: dotnet/runtime
        ref: release/9.0
        path: runtime

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib zlib1g-dev:i386 libicu-dev:i386 libicu74:i386 libssl-dev:i386 libssl3:i386 libunwind-dev:i386 debootstrap qemu-user-static binutils libc6:i386 libstdc++6:i386 libgcc-s1:i386 cmake ninja-build ccache clang python3 file

    - name: Setup ccache
      run: |
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        ccache -M 2.0G
        ccache -z

    - name: Build x86 Cross-Compilation RootFS
      working-directory: runtime
      run: |
        sudo ./eng/common/cross/build-rootfs.sh x86

    - name: Surgically Patch CoreCLR to Use Dummy Provider
      working-directory: runtime
      run: |
        sed -i 's/if(NOT HAVE_LTTNG_TRACEPOINT_H AND FEATURE_EVENT_TRACE)/if(FALSE)/' src/coreclr/pal/src/configure.cmake
        sed -i 's/if(CLR_CMAKE_HOST_LINUX)/if(FALSE)/' src/coreclr/pal/src/eventprovider/CMakeLists.txt

    - name: Install and Patch .NET SDK
      working-directory: runtime
      run: |
        SDK_VERSION=$(python3 -c "import json; print(json.load(open('global.json'))['sdk']['version'])")
        mkdir -p .dotnet
        wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --version $SDK_VERSION --install-dir .dotnet
        
        python3 -c "
        import json
        path = '.dotnet/sdk/$SDK_VERSION/RuntimeIdentifierGraph.json'
        with open(path, 'r') as f: data = json.load(f)
        if 'linux-x86' not in data['runtimes']:
            data['runtimes']['linux-x86'] = { '#import': ['linux'] }
        with open(path, 'w') as f: json.dump(data, f, indent=2)
        "

    - name: Build CoreCLR, Libraries, and Host
      working-directory: runtime
      env:
        ROOTFS_DIR: ${{ github.workspace }}/runtime/.tools/rootfs/x86
        DOTNET_INSTALL_DIR: ${{ github.workspace }}/runtime/.dotnet
        DOTNET_MULTILEVEL_LOOKUP: 0
      run: |
        # Wir versuchen jetzt, den echten 'host' (dotnet) zu bauen. 
        # Falls das aufgrund des gepatchten RID-Graphen funktioniert, ist es viel robuster als corerun.
        ./build.sh -os linux -arch x86 -c Release -subset clr+libs+host -cross --ninja \
          /p:UseNinja=true /p:InvariantGlobalization=false /p:BuildAppHost=false

    - name: Package Self-Contained Runtime (Using Testhost Layout for Minimal TPA)
      run: |
        mkdir -p dotnet-portable-x86
        
        # 1. Versuche, den echten 'dotnet' Host zu finden (falls der Build erfolgreich war)
        DOTNET_HOST=$(find runtime/artifacts/bin -type f -name "dotnet" | grep -i "linux.x86" | head -n 1)
        
        if [ -n "$DOTNET_HOST" ]; then
          echo "Found official dotnet host! Using it."
          HOST_DIR=$(dirname "$DOTNET_HOST")
          cp "$HOST_DIR"/dotnet dotnet-portable-x86/
          cp "$HOST_DIR"/*.so dotnet-portable-x86/ 2>/dev/null || true
          EXECUTABLE_NAME="dotnet"
        else
          echo "Falling back to corerun with minimal testhost layout."
          CORECLR_DIR=$(find runtime/artifacts/bin/coreclr -type d \( -name "Linux.x86.Release" -o -name "linux.x86.Release" \) | head -n 1)
          cp "$CORECLR_DIR/corerun" dotnet-portable-x86/
          cp "$CORECLR_DIR"/*.so dotnet-portable-x86/
          EXECUTABLE_NAME="corerun"
        fi
        
        # 2. CRITICAL FIX: Use the official 'testhost' directory for DLLs.
        # This contains the EXACT, MINIMAL set of DLLs needed to run apps, 
        # preventing the TPA string from becoming too long and causing 0x8007000e.
        TESTHOST_DIR=$(find runtime/artifacts/bin/testhost -type d -iname "*linux*x86*release*" | head -n 1)
        
        if [ -n "$TESTHOST_DIR" ]; then
          echo "Using minimal testhost layout from: $TESTHOST_DIR"
          cp "$TESTHOST_DIR"/*.dll dotnet-portable-x86/
          # Also copy the shared framework folder structure if it exists
          cp -r "$TESTHOST_DIR/shared" dotnet-portable-x86/ 2>/dev/null || true
        else
          echo "WARNING: testhost not found. Falling back to manual minimal copy."
          # Fallback: Only copy the absolute essentials
          find runtime/artifacts/bin -type f \( -name "System.Private.CoreLib.dll" -o -name "System.Runtime.dll" -o -name "System.Console.dll" -o -name "mscorlib.dll" -o -name "netstandard.dll" \) | grep -i "linux.x86.release" | head -n 20 | xargs -I {} cp {} dotnet-portable-x86/
        fi

    - name: STRICT Architecture Verification
      run: |
        echo "=== Checking executable architecture ==="
        file dotnet-portable-x86/$EXECUTABLE_NAME
        if ! file dotnet-portable-x86/$EXECUTABLE_NAME | grep -qi "32-bit"; then
          echo "FATAL: Executable is NOT 32-bit!" && exit 1
        fi
        echo "=== ldd check (looking for missing .so files) ==="
        ldd dotnet-portable-x86/$EXECUTABLE_NAME || true

    - name: Create "Run From Anywhere" Launcher (WITH LD_DEBUG)
      run: |
        cat << 'EOF' > dotnet-portable-x86/run.sh
        #!/bin/bash
        DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"
        export DOTNET_ROOT="$DIR"
        ulimit -v unlimited
        ulimit -m unlimited
        export DOTNET_GCHeapHardLimit=0x40000000
        export DOTNET_TieredCompilation=0
        
        # ULTIMATE DIAGNOSTIC: If it fails, this will print the EXACT missing .so 
        # or the exact mmap failure, leaving zero room for guessing.
        export LD_DEBUG=libs,bindings
        
        exec "$DIR/$EXECUTABLE_NAME" "$@"
        EOF
        # Dynamically replace EXECUTABLE_NAME in the script
        sed -i "s/\$EXECUTABLE_NAME/$EXECUTABLE_NAME/g" dotnet-portable-x86/run.sh
        chmod +x dotnet-portable-x86/run.sh

    - name: Install Standard .NET 9 SDK
      run: |
        wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 9.0 --install-dir ./dotnet-sdk

    - name: Create & Compile IL Stress Test
      run: |
        ./dotnet-sdk/dotnet new console -n IL_Stress_Test -o IL_Stress_Test --framework net9.0
        cat << 'CSHARP' > IL_Stress_Test/Program.cs
        using System;
        using System.Threading;
        using System.Runtime.InteropServices;

        class Program {
            static int Main() {
                Console.WriteLine("=== Starting IL Stress Test for Linux x86 ===");
                double result = 0;
                for(int i=0; i<10000; i++) result += Math.Sin(i) * Math.Cos(i);
                Console.WriteLine($"[PASS] Math/SSE Stack Alignment: {result}");
                
                byte[][] arrays = new byte[10][]; // Reduced from 100 to be extra safe on 32-bit
                for(int i=0; i<10; i++) arrays[i] = new byte[1024 * 1024]; 
                GC.Collect();
                Console.WriteLine("[PASS] GC & Memory Allocation");
                
                int pid = getpid();
                Console.WriteLine($"[PASS] P/Invoke (libc getpid): {pid}");
                Console.WriteLine("=== ALL IL TESTS PASSED! RUNTIME IS STABLE ===");
                return 0;
            }
            [DllImport("libc")]
            static extern int getpid();
        }
        CSHARP
        ./dotnet-sdk/dotnet build IL_Stress_Test -c Release

    - name: Execute IL Stress Test
      run: |
        ./dotnet-portable-x86/run.sh ./IL_Stress_Test/bin/Release/net9.0/IL_Stress_Test.dll

    - name: Zip and Upload
      if: success()
      run: zip -r dotnet9-linux-x86-portable.zip dotnet-portable-x86
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: dotnet9-linux-x86-tested
        path: dotnet9-linux-x86-portable.zip
