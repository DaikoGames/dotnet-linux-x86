name: Experimental .NET Linux x86

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86:
    runs-on: ubuntu-24.04

    env:
      DOTNET_REPO: https://github.com/dotnet/runtime.git
      DOTNET_REF: main
      CONFIGURATION: Release
      ARCH: x86
      TARGET_OS: linux

    steps:
      - name: Checkout .NET runtime
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: ${{ env.DOTNET_REF }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            curl \
            git \
            wget \
            llvm \
            lld \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libstdc++-12-dev:i386 \
            zlib1g-dev:i386 \
            libssl-dev:i386 \
            libicu-dev:i386

      - name: Show host architecture
        run: |
          echo "Host:"
          uname -a
          uname -m

          echo
          echo "Available GCC:"
          gcc --version

          echo
          echo "32-bit compiler test:"
          printf '#include <stdio.h>\nint main(){printf("32-bit OK\\n");return 0;}' \
            > /tmp/test32.c

          if gcc -m32 /tmp/test32.c -o /tmp/test32; then
            file /tmp/test32
            /tmp/test32
          else
            echo "::warning::The host cannot produce a 32-bit test executable."
          fi

      - name: Restore .NET build tools
        continue-on-error: true
        run: |
          ./eng/common/native/init-compiler.sh

      - name: Attempt CoreCLR x86 build
        id: coreclr
        continue-on-error: true
        run: |
          echo "Attempting experimental Linux x86 CoreCLR build..."

          ./build.sh \
            -subset clr+libs \
            -arch x86 \
            -os linux \
            -configuration "$CONFIGURATION"

      - name: Locate produced binaries
        id: locate
        continue-on-error: true
        run: |
          mkdir -p artifacts/linux-x86

          echo "Searching for produced CoreCLR files..."

          find artifacts \
            \( -name "libcoreclr.so" \
            -o -name "corerun" \
            -o -name "hostfxr" \
            -o -name "libhostfxr.so" \
            -o -name "System.Private.CoreLib.dll" \
            -o -name "dotnet" \) \
            -type f \
            -print \
            | tee artifacts/linux-x86/produced-files.txt

          echo
          echo "Architecture checks:"

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo
              echo "===== $file ====="
              file "$file" || true
            fi
          done < artifacts/linux-x86/produced-files.txt

      - name: Runtime smoke test
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p artifacts/linux-x86/test

          cat > artifacts/linux-x86/test/README.txt <<'EOF'
          Experimental Linux x86 .NET runtime build.

          This build is not an officially supported .NET RID.
          The workflow attempts to build CoreCLR for 32-bit Linux
          and records whether the generated binaries can actually
          execute on the build machine.
          EOF

          if [ -x artifacts/bin/coreclr/linux.x86.Release/corerun ]; then
            CORERUN=artifacts/bin/coreclr/linux.x86.Release/corerun

            echo "Testing corerun..."
            file "$CORERUN"

            if "$CORERUN" --help; then
              echo "CORERUN_EXECUTABLE=YES" \
                | tee artifacts/linux-x86/test/result.txt
            else
              echo "CORERUN_EXECUTABLE=NO" \
                | tee artifacts/linux-x86/test/result.txt
              echo "ERROR: corerun was produced but could not execute."
            fi
          else
            echo "CORERUN_EXECUTABLE=NOT_BUILT" \
              | tee artifacts/linux-x86/test/result.txt

            echo "ERROR: CoreCLR did not produce corerun."
          fi

      - name: Check 32-bit ELF compatibility
        continue-on-error: true
        run: |
          echo "Checking all generated ELF binaries..."

          find artifacts -type f -exec file {} \; \
            | grep -E 'ELF.*(32-bit|Intel 80386)' \
            | tee artifacts/linux-x86/elf32.txt || true

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p artifacts/linux-x86/logs

          if [ -d artifacts/log ]; then
            cp -a artifacts/log/. artifacts/linux-x86/logs/ || true
          fi

          {
            echo "===== BUILD RESULT ====="
            echo "CoreCLR step: ${{ steps.coreclr.outcome }}"
            echo "Smoke test:   ${{ steps.smoke.outcome }}"
            echo
            echo "===== SYSTEM ====="
            uname -a
            getconf LONG_BIT || true
            free -h
            cat /proc/meminfo
          } > artifacts/linux-x86/build-report.txt

      - name: Create failure marker
        if: always()
        run: |
          mkdir -p artifacts/linux-x86

          if [ "${{ steps.coreclr.outcome }}" != "success" ]; then
            cat > artifacts/linux-x86/BUILD_FAILED.txt <<'EOF'
          ERROR: The experimental Linux x86 CoreCLR build did not complete.

          The workflow intentionally continued so that partial binaries,
          build logs, compiler output, and diagnostics could still be
          downloaded.

          This does NOT mean that the produced binaries are runnable.
          Check produced-files.txt, build-report.txt, elf32.txt, and logs/.
          EOF
          fi

      - name: Package partial/full runtime
        if: always()
        run: |
          mkdir -p artifacts/linux-x86/runtime

          for path in \
            artifacts/bin/coreclr/linux.x86.Release \
            artifacts/tests/coreclr/linux.x86.Release/Tests/Core_Root
          do
            if [ -d "$path" ]; then
              cp -a "$path" artifacts/linux-x86/runtime/
            fi
          done

          tar -C artifacts/linux-x86 \
            -czf artifacts/linux-x86-runtime.tar.gz \
            runtime test logs \
            *.txt 2>/dev/null || true

      - name: Upload Linux x86 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-x86-experimental
          path: artifacts/linux-x86-runtime.tar.gz
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-x86-diagnostics
          path: artifacts/linux-x86
          if-no-files-found: warn

      - name: Final status
        if: always()
        run: |
          echo
          echo "=========================================="
          echo " Experimental Linux x86 build completed"
          echo "=========================================="
          echo

          if [ "${{ steps.coreclr.outcome }}" = "success" ]; then
            echo "CoreCLR build: SUCCESS"
          else
            echo "CoreCLR build: FAILED"
            echo "Partial artifacts and logs were uploaded."
          fi

          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "Runtime smoke test: SUCCESS"
          else
            echo "Runtime smoke test: FAILED/UNAVAILABLE"
          fi

          echo
          echo "The workflow intentionally does not fail the job."