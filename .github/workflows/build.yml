name: Experimental .NET Linux-x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  CONFIGURATION: Release
  TARGET_ARCH: x86
  TARGET_OS: linux
  HOST_ARCH: x64
  ROOTFS_DIR: ${{ github.workspace }}/.tools/rootfs/x86

jobs:
  build-coreclr-x86:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout .NET Runtime
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: release/10.0
          fetch-depth: 1

      - name: Enable 32-bit architecture
        run: |
          set -eux

          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            binutils \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            pkg-config \
            zlib1g-dev:i386 \
            libssl-dev:i386 \
            libicu-dev:i386

      - name: Install rootfs Python dependencies
        run: |
          set -eux

          python3 -m pip install \
            --user \
            --break-system-packages \
            aiohttp

          python3 -c \
            "import aiohttp; print('aiohttp:', aiohttp.__version__)"

      - name: Verify 32-bit compiler
        run: |
          set -eux

          cat > /tmp/test32.c <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              printf("32-bit compiler works\n");
              return 0;
          }
          EOF

          gcc -m32 /tmp/test32.c -o /tmp/test32

          file /tmp/test32

          /tmp/test32

          file /tmp/test32 | grep -q \
            'ELF 32-bit.*Intel 80386'

      - name: Create Linux x86 rootfs
        run: |
          set -eux

          rm -rf "$ROOTFS_DIR"
          mkdir -p "$ROOTFS_DIR"

          sudo -E ./eng/common/cross/build-rootfs.sh \
            x86 \
            noble \
            --skipemulation \
            --rootfsdir "$ROOTFS_DIR"

          sudo chown -R "$(id -u):$(id -g)" "$ROOTFS_DIR"

      - name: Verify Linux x86 rootfs
        run: |
          set -eux

          test -d "$ROOTFS_DIR"
          test -d "$ROOTFS_DIR/usr"
          test -d "$ROOTFS_DIR/usr/include"

          echo "=== Rootfs size ==="
          du -sh "$ROOTFS_DIR"

          echo
          echo "=== Rootfs libc ==="

          find "$ROOTFS_DIR" \
            -type f \
            -name 'libc.so*' \
            -print \
            | head -20

          echo
          echo "=== Rootfs libc architecture ==="

          if [ -f "$ROOTFS_DIR/lib/i386-linux-gnu/libc.so.6" ]; then
            file "$ROOTFS_DIR/lib/i386-linux-gnu/libc.so.6"
          elif [ -f "$ROOTFS_DIR/usr/lib/i386-linux-gnu/libc.so.6" ]; then
            file "$ROOTFS_DIR/usr/lib/i386-linux-gnu/libc.so.6"
          else
            echo "ERROR: Could not locate 32-bit libc"
            exit 1
          fi

      - name: Restore .NET build tools
        run: |
          set -eux

          ./restore.sh

      - name: Build CoreCLR Linux x86
        run: |
          set -eux
          set -o pipefail

          mkdir -p build-log

          export ROOTFS_DIR="$ROOTFS_DIR"

          ./src/coreclr/build-runtime.sh \
            -arch x86 \
            -hostarch x64 \
            -os linux \
            -release \
            -cross \
            -component clr.runtime \
            -component clr.corelib \
            -component clr.jit \
            2>&1 \
            | tee build-log/coreclr-x86.log

      - name: Locate CoreCLR artifacts
        run: |
          set -eux

          echo "=== CoreCLR artifacts ==="

          find artifacts/bin/coreclr \
            -type f \
            \( \
              -name 'libcoreclr.so' \
              -o -name 'clrjit.so' \
              -o -name 'corerun' \
              -o -name 'System.Private.CoreLib.dll' \
            \) \
            -print

      - name: Locate libcoreclr.so
        run: |
          set -eux

          CORECLR="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'libcoreclr.so' \
              | head -1
          )"

          if [ -z "$CORECLR" ]; then
            echo "ERROR: libcoreclr.so was not produced."
            exit 1
          fi

          echo "CoreCLR:"
          echo "$CORECLR"

          echo
          echo "=== libcoreclr.so ==="

          file "$CORECLR"

          file "$CORECLR" | grep -q \
            'ELF 32-bit.*Intel 80386'

      - name: Verify CoreCLR JIT
        run: |
          set -eux

          JIT="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'clrjit.so' \
              | head -1
          )"

          if [ -z "$JIT" ]; then
            echo "ERROR: clrjit.so was not produced."
            exit 1
          fi

          echo "JIT:"
          echo "$JIT"

          echo
          echo "=== clrjit.so ==="

          file "$JIT"

          file "$JIT" | grep -q \
            'ELF 32-bit.*Intel 80386'

      - name: Verify corerun
        run: |
          set -eux

          CORERUN="$(
            find artifacts/bin/coreclr \
              -type f \
              -name 'corerun' \
              | head -1
          )"

          if [ -z "$CORERUN" ]; then
            echo "ERROR: corerun was not produced."
            exit 1
          fi

          echo "corerun:"
          echo "$CORERUN"

          echo
          echo "=== corerun ==="

          file "$CORERUN"

          file "$CORERUN" | grep -q \
            'ELF 32-bit.*Intel 80386'

          chmod +x "$CORERUN"

          echo
          echo "=== corerun help ==="

          "$CORERUN" --help || true

      - name: Verify all native CoreCLR binaries
        run: |
          set -eux

          echo "=== Native binaries ==="

          find artifacts/bin/coreclr \
            -type f \
            -exec file {} \; \
            | grep 'ELF 32-bit'

      - name: Show CoreCLR directory
        if: always()
        run: |
          set +e

          echo "=== artifacts/bin/coreclr ==="

          find artifacts/bin/coreclr \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

      - name: Upload CoreCLR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coreclr-linux-x86-${{ github.sha }}
          path: |
            artifacts/bin/coreclr/
            build-log/coreclr-x86.log
          if-no-files-found: warn
