name: Build & Test .NET 9 Linux x86 (Surgical LTTng Bypass)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  UseNinja: true
  CMAKE_GENERATOR: Ninja
  CFLAGS: "-mstackrealign -fPIC"
  CXXFLAGS: "-mstackrealign -fPIC -ftls-model=global-dynamic"
  LDFLAGS: "-Wl,-z,noexecstack"

jobs:
  build-and-test-linux-x86:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout .NET 9 Runtime
      uses: actions/checkout@v4
      with:
        repository: dotnet/runtime
        ref: release/9.0
        path: runtime

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib zlib1g-dev:i386 libicu-dev:i386 libssl-dev:i386 libunwind-dev:i386 debootstrap qemu-user-static binutils libc6:i386 libstdc++6:i386 libgcc-s1:i386 cmake ninja-build ccache clang python3

    - name: Setup ccache
      run: |
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        ccache -M 2.0G
        ccache -z

    - name: Build x86 Cross-Compilation RootFS
      working-directory: runtime
      run: |
        sudo ./eng/common/cross/build-rootfs.sh x86

    - name: Surgically Patch CoreCLR to Use Dummy Provider
      working-directory: runtime
      run: |
        # 1. Prevent the FATAL_ERROR in configure.cmake when it can't find lttng-ust
        sed -i 's/if(NOT HAVE_LTTNG_TRACEPOINT_H AND FEATURE_EVENT_TRACE)/if(FALSE)/' src/coreclr/pal/src/configure.cmake
        
        # 2. Force CMake to ALWAYS use the dummyprovider instead of lttngprovider on Linux.
        # This prevents the Python script from generating C++ files that try to include <lttng/tracepoint.h>
        sed -i 's/if(CLR_CMAKE_HOST_LINUX)/if(FALSE) # Always use dummyprovider to avoid LTTng dependency/' src/coreclr/pal/src/eventprovider/CMakeLists.txt
        
        echo "Successfully patched CoreCLR to use dummyprovider and ignore missing LTTng"

    - name: Install and Patch .NET SDK
      working-directory: runtime
      run: |
        SDK_VERSION=$(python3 -c "import json; print(json.load(open('global.json'))['sdk']['version'])")
        echo "Required SDK version: $SDK_VERSION"
        
        mkdir -p .dotnet
        wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --version $SDK_VERSION --install-dir .dotnet
        
        python3 -c "
        import json
        path = '.dotnet/sdk/$SDK_VERSION/RuntimeIdentifierGraph.json'
        with open(path, 'r') as f:
            data = json.load(f)
        if 'linux-x86' not in data['runtimes']:
            data['runtimes']['linux-x86'] = { '#import': ['linux'] }
        with open(path, 'w') as f:
            json.dump(data, f, indent=2)
        print('Successfully patched RuntimeIdentifierGraph.json')
        "

    - name: Build CoreCLR and Libraries
      working-directory: runtime
      env:
        ROOTFS_DIR: ${{ github.workspace }}/runtime/.tools/rootfs/x86
        DOTNET_INSTALL_DIR: ${{ github.workspace }}/runtime/.dotnet
        DOTNET_MULTILEVEL_LOOKUP: 0
      run: |
        ./build.sh -os linux -arch x86 -c Release -subset clr+libs -cross --ninja \
          /p:UseNinja=true \
          /p:InvariantGlobalization=false \
          /p:BuildAppHost=false

    - name: Package Self-Contained Runtime
      run: |
        mkdir -p dotnet-portable-x86
        cp runtime/artifacts/bin/coreclr/Linux.x86.Release/corerun dotnet-portable-x86/
        cp runtime/artifacts/bin/coreclr/Linux.x86.Release/*.so dotnet-portable-x86/
        cp runtime/artifacts/bin/System.Private.CoreLib/Linux.x86.Release/System.Private.CoreLib.dll dotnet-portable-x86/
        find runtime/artifacts/bin/runtime/ -name "*.dll" -exec cp {} dotnet-portable-x86/ \;

    - name: Create "Run From Anywhere" Launcher
      run: |
        cat << 'EOF' > dotnet-portable-x86/run.sh
        #!/bin/bash
        DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"
        export DOTNET_ROOT="$DIR"
        exec "$DIR/corerun" "$@"
        EOF
        chmod +x dotnet-portable-x86/run.sh

    - name: Install Standard .NET 9 SDK
      run: |
        wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 9.0 --install-dir ./dotnet-sdk

    - name: Create IL Stress Test Project
      run: |
        ./dotnet-sdk/dotnet new console -n IL_Stress_Test -o IL_Stress_Test --framework net9.0
        cat << 'CSHARP' > IL_Stress_Test/Program.cs
        using System;
        using System.Threading;
        using System.Threading.Tasks;
        using System.Runtime.InteropServices;

        class Program {
            static int Main() {
                Console.WriteLine("=== Starting IL Stress Test for Linux x86 ===");
                double result = 0;
                for(int i=0; i<10000; i++) result += Math.Sin(i) * Math.Cos(i);
                Console.WriteLine($"[PASS] Math/SSE Stack Alignment: {result}");
                Parallel.For(0, 100, i => { Thread.Sleep(1); });
                Console.WriteLine("[PASS] Threading & TLS");
                byte[][] arrays = new byte[100][];
                for(int i=0; i<100; i++) arrays[i] = new byte[1024 * 1024]; 
                GC.Collect();
                Console.WriteLine("[PASS] GC & Memory Allocation");
                int pid = getpid();
                Console.WriteLine($"[PASS] P/Invoke (libc getpid): {pid}");
                Console.WriteLine("=== ALL IL TESTS PASSED! RUNTIME IS STABLE ===");
                return 0;
            }
            [DllImport("libc")]
            static extern int getpid();
        }
        CSHARP

    - name: Compile IL Stress Test
      working-directory: IL_Stress_Test
      run: |
        ../dotnet-sdk/dotnet build -c Release

    - name: Execute IL Stress Test on Custom x86 Runtime
      run: |
        ./dotnet-portable-x86/run.sh ./IL_Stress_Test/bin/Release/net9.0/IL_Stress_Test.dll

    - name: Zip the Final Abomination
      if: success()
      run: |
        zip -r dotnet9-linux-x86-portable.zip dotnet-portable-x86

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dotnet9-linux-x86-selfcontained-tested
        path: dotnet9-linux-x86-portable.zip
        retention-days: 7